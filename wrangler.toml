name = "vpsai"
main = "dist/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[vars]
# Environment variables will go here

[[kv_namespaces]]
binding = "vpsai_kv"
id = "vpsai_kv_id"

[assets]
directory = "./public"
binding = "ASSETS"
